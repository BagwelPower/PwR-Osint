name: CI & Android APK

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aynı dal için yeni bir push gelince eski çalıştırma iptal edilir.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: osint_tool

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt "flet==1.1.2" ruff
      - name: Statik analiz
        run: ruff check pwrosint main.py tests
      - name: Birim testleri
        run: python -m pytest -q
      - name: Arayüz içe aktarılabiliyor mu
        run: python -c "import main, pwrosint.cli"

  live:
    # Dış servislere karşı duman testi: API biçimi değişirse haber verir,
    # ama geçici servis kesintileri APK derlemesini engellemesin.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v tests/live -rA
        env:
          PWR_LIVE: "1"
          PYTHONPATH: tests

  build-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Flet CLI kur
        run: pip install "flet[all]==1.1.2"
      - name: APK derle
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        # Gradle, Python dağıtımını indirirken ara sıra bozuk dosya alabiliyor; bir kez daha dene.
        run: |
          for attempt in 1 2; do
            flet build apk --yes --verbose \
              --exclude tests osint_tool.py requirements.txt requirements-dev.txt config.json.example \
              --build-version "2.2.${{ github.run_number }}" --build-number "${{ github.run_number }}" && exit 0
            echo "::warning::APK derlemesi başarısız (deneme $attempt), önbellek temizlenip tekrar deneniyor"
            rm -rf build ~/.gradle/caches/*/download-* 2>/dev/null || true
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: PwR-Osint-apk
          path: osint_tool/build/apk/*.apk
          if-no-files-found: error
      - name: Release'e ekle (v* tag'lerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: osint_tool/build/apk/*.apk

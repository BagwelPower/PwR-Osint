name: Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: osint_tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flet CLI kur
        run: pip install "flet[all]==1.1.2"

      - name: APK derle
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: flet build apk --yes --verbose --build-version "1.0.${{ github.run_number }}" --build-number "${{ github.run_number }}"

      - uses: actions/upload-artifact@v4
        with:
          name: PwR-Osint-apk
          path: osint_tool/build/apk/*.apk
          if-no-files-found: error

      - name: Release'e ekle (v* tag'lerinde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: osint_tool/build/apk/*.apk
